<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>chen!</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brandPink: '#ff6b9d',
                        brandCyan: '#4cd0d0',
                        brandOrange: '#ffb86c',
                        darkText: '#1a1a2e'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            /* 背景图专用样式，放入渐变底图hero-gradient-bg.png */
            .hero-bg-image {
                background-image: url("./hero-gradient-bg.png");
                background-size: cover;
                background-position: center;
                background-repeat: no-repeat;
            }
            .track-item-hover {
                transition: all 0.2s ease;
            }
            .track-item-hover:hover {
                background: #f8f9ff;
            }
            .progress-slider {
                -webkit-appearance: none;
                width: 100%;
                height: 4px;
                border-radius: 99px;
                background: rgba(255,255,255,0.3);
            }
            .progress-slider::-webkit-slider-thumb {
                -webkit-appearance: none;
                width: 12px;
                height: 12px;
                border-radius: 50%;
                background: #fff;
                cursor: pointer;
            }
        }
    </style>
</head>
<body class="bg-white font-sans text-darkText overflow-x-hidden">
    <!-- Hero 主视觉区域（可加载渐变底图） -->
    <section class="min-h-screen hero-bg-image px-6 md:px-12 lg:px-20 py-8 relative overflow-hidden">
        <!-- 柔光遮罩，保护文字可读性 -->
        <div class="absolute inset-0 bg-white/20"></div>
        <div class="relative z-10">
            <!-- 顶部Logo预留位 -->
            <div class="flex justify-center mb-10">
                <img src="./chen-logo.png" alt="chen! logo" class="h-14">
            </div>

            <!-- 响应式布局：PC左右分栏 / 移动端上下堆叠 -->
            <div class="grid lg:grid-cols-2 items-center gap-6 lg:gap-0">
                <!-- 左侧文字区（移动端在上） -->
                <div class="order-1 lg:order-1 pt-4 lg:pt-0">
                    <p class="text-lg text-gray-700 mb-2">Hello,<br>I'm chen!</p>
                    <h1 class="text-[clamp(2.5rem,6vw,4rem)] font-bold leading-tight mb-4">
                        Your Story,<br>
                        <span class="italic font-normal">My Song.</span>
                    </h1>
                    <p class="text-gray-600 max-w-sm">
                        A virtual singer here to share moments that move us—together.
                    </p>
                </div>

                <!-- 人物图：移动端文字下方、底边贴播放器；PC右侧缩小10%下移 -->
                <div class="order-2 lg:order-2 flex justify-end lg:translate-y-6 mt-8 lg:mt-0">
                    <img 
                        src="./chen-girl.png" 
                        alt="chen! virtual singer" 
                        class="max-w-[90%] w-[90%] scale-90 origin-right lg:origin-right mx-auto lg:mx-0"
                    >
                </div>
            </div>
        </div>
    </section>

    <!-- 音乐播放器模块（人物底部对齐上端） -->
    <section class="px-6 md:px-12 lg:px-20 -mt-10 lg:-mt-24 relative z-10 pb-16">
        <div class="bg-white rounded-2xl shadow-xl p-6 md:p-8 max-w-5xl mx-auto">
            <div class="mb-6">
                <p class="text-brandPink text-sm font-medium tracking-wide mb-1">LISTEN NOW</p>
                <h2 class="text-2xl font-bold">Featured Tracks</h2>
            </div>
            <div class="grid lg:grid-cols-2 gap-8">
                <!-- 歌曲列表 -->
                <div class="space-y-3" id="trackList">
                    <div class="track-item-hover rounded-xl p-3 flex items-center gap-4 bg-gray-50 cursor-pointer" data-index="0">
                        <div class="w-10 h-10 rounded-md bg-gradient-to-r from-brandPink to-brandOrange flex items-center justify-center text-white play-icon">
                            <i class="fa fa-play"></i>
                        </div>
                        <div class="flex-1">
                            <p class="font-medium">We Share</p>
                        </div>
                        <span class="text-gray-400 text-sm track-duration">03:42</span>
                    </div>
                    <div class="track-item-hover rounded-xl p-3 flex items-center gap-4 cursor-pointer" data-index="1">
                        <div class="w-10 h-10 rounded-md bg-[#a0d8f0] flex items-center justify-center text-white play-icon">
                            <i class="fa fa-play-o"></i>
                        </div>
                        <div class="flex-1">
                            <p class="font-medium">雨的節奏</p>
                        </div>
                        <span class="text-gray-400 text-sm track-duration">03:58</span>
                        <i class="fa fa-ellipsis-v text-gray-300"></i>
                    </div>
                    <div class="track-item-hover rounded-xl p-3 flex items-center gap-4 cursor-pointer" data-index="2">
                        <div class="w-10 h-10 rounded-md bg-[#e0d8ff] flex items-center justify-center text-white play-icon">
                            <i class="fa fa-play-o"></i>
                        </div>
                        <div class="flex-1">
                            <p class="font-medium">To the Light</p>
                        </div>
                        <span class="text-gray-400 text-sm track-duration">04:21</span>
                        <i class="fa fa-ellipsis-v text-gray-300"></i>
                    </div>
                    <div class="track-item-hover rounded-xl p-3 flex items-center gap-4 cursor-pointer" data-index="3">
                        <div class="w-10 h-10 rounded-md bg-[#2a1b47] flex items-center justify-center text-white play-icon">
                            <i class="fa fa-play-o"></i>
                        </div>
                        <div class="flex-1">
                            <p class="font-medium">Moonlight on Repeat</p>
                        </div>
                        <span class="text-gray-400 text-sm track-duration">03:33</span>
                        <i class="fa fa-ellipsis-v text-gray-300"></i>
                    </div>
                </div>
                <!-- 播放器控制面板 -->
                <div class="bg-gradient-to-br from-brandPink to-brandOrange rounded-xl p-6 flex flex-col justify-between text-white">
                    <div class="mb-6 flex justify-between items-start">
                        <div>
                            <h3 class="text-3xl font-bold mb-2" id="playerTitle">We Share</h3>
                            <p class="text-white/80 text-sm">chen!</p>
                        </div>
                        <i class="fa fa-heart-o text-xl cursor-pointer hover:scale-110 transition-all"></i>
                    </div>
                    <div class="w-full mb-4">
                        <input type="range" min="0" max="100" value="0" class="progress-slider w-full" id="progressBar">
                        <div class="flex justify-between text-white/70 text-xs mt-1">
                            <span id="currentTime">00:00</span>
                            <span id="totalTime">03:42</span>
                        </div>
                    </div>
                    <div class="flex items-center justify-center gap-6 text-xl">
                        <i class="fa fa-random opacity-70 cursor-pointer" id="shuffleBtn"></i>
                        <i class="fa fa-step-backward opacity-70 cursor-pointer" id="prevBtn"></i>
                        <button class="w-12 h-12 rounded-full bg-white text-brandPink flex items-center justify-center text-lg" id="mainPlayBtn">
                            <i class="fa fa-pause"></i>
                        </button>
                        <i class="fa fa-step-forward opacity-70 cursor-pointer" id="nextBtn"></i>
                        <i class="fa fa-repeat opacity-70 cursor-pointer" id="loopBtn"></i>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- 订阅邮件区块 -->
    <section class="bg-gradient-to-r from-brandPink/15 to-brandCyan/15 px-6 md:px-12 lg:px-20 py-10">
        <div class="max-w-5xl mx-auto flex flex-col md:flex-row items-center justify-between gap-6">
            <div>
                <h3 class="text-xl font-bold mb-1">Be the first to know.</h3>
                <p class="text-gray-500 text-sm">Get the latest updates from chen!</p>
            </div>
            <div class="flex w-full md:w-auto">
                <input type="email" placeholder="Enter your email" class="px-4 py-3 rounded-l-full border border-gray-200 outline-none w-full md:w-64 focus:border-brandPink transition-all">
                <button class="bg-darkText text-white px-6 py-3 rounded-r-full hover:opacity-90 transition-all">Subscribe</button>
            </div>
        </div>
    </section>

    <!-- 音频标签，增加autoplay自动播放 -->
    <audio id="audioPlayer" autoplay muted>
        <source src="https://example.com/WeShare.mp3" type="audio/mpeg">
    

    <script>
        const trackList = [
            { title: "We Share", src: "d50308.github.io
/We Share.mp3", duration: "03:42" },
            { title: "雨的節奏", src: "https://example.com/rain.mp3", duration: "03:58" },
            { title: "To the Light", src: "https://example.com/light.mp3", duration: "04:21" },
            { title: "Moonlight on Repeat", src: "https://example.com/moon.mp3", duration: "03:33" }
        ];
        let currentIndex = 0;
        let isPlaying = true;
        let isLoop = false;
        let isShuffle = false;

        const audio = document.getElementById('audioPlayer');
        const mainPlayBtn = document.getElementById('mainPlayBtn');
        const progressBar = document.getElementById('progressBar');
        const currentTimeEl = document.getElementById('currentTime');
        const totalTimeEl = document.getElementById('totalTime');
        const playerTitle = document.getElementById('playerTitle');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const loopBtn = document.getElementById('loopBtn');
        const shuffleBtn = document.getElementById('shuffleBtn');
        const trackItems = document.querySelectorAll('#trackList > div');

        // 加载歌曲
        function loadTrack(index) {
            currentIndex = index;
            const track = trackList[currentIndex];
            audio.src = track.src;
            playerTitle.innerText = track.title;
            totalTimeEl.innerText = track.duration;
            audio.currentTime = 0;
            progressBar.value = 0;
            currentTimeEl.innerText = "00:00";
            trackItems.forEach((item, idx) => {
                const icon = item.querySelector('.play-icon i');
                if(idx === currentIndex) {
                    icon.className = isPlaying ? "fa fa-pause" : "fa fa-play";
                    item.classList.add('bg-gray-50');
                } else {
                    icon.className = "fa fa-play-o";
                    item.classList.remove('bg-gray-50');
                }
            })
        }

        // 时间格式化
        function formatTime(sec) {
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
        }

        // 播放暂停切换
        function togglePlay() {
            if(isPlaying) {
                audio.pause();
                mainPlayBtn.innerHTML = '<i class="fa fa-play"></i>';
                trackItems[currentIndex].querySelector('.play-icon i').className = "fa fa-play";
            } else {
                audio.play();
                mainPlayBtn.innerHTML = '<i class="fa fa-pause"></i>';
                trackItems[currentIndex].querySelector('.play-icon i').className = "fa fa-pause";
            }
            isPlaying = !isPlaying;
        }

        // 进度同步
        audio.addEventListener('timeupdate', () => {
            const percent = (audio.currentTime / audio.duration) * 100 || 0;
            progressBar.value = percent;
            currentTimeEl.innerText = formatTime(audio.currentTime);
        })

        // 拖动进度条跳转
        progressBar.addEventListener('input', () => {
            const seekSec = (progressBar.value / 100) * audio.duration;
            audio.currentTime = seekSec;
        })

        // 歌曲结束逻辑
        audio.addEventListener('ended', () => {
            if(isLoop) {
                audio.currentTime = 0;
                audio.play();
            } else {
                nextTrack();
            }
        })

        // 下一首
        function nextTrack() {
            if(isShuffle) {
                let randomIdx = Math.floor(Math.random() * trackList.length);
                while(randomIdx === currentIndex) randomIdx = Math.floor(Math.random() * trackList.length);
                loadTrack(randomIdx);
            } else {
                currentIndex = (currentIndex + 1) % trackList.length;
                loadTrack(currentIndex);
            }
            if(isPlaying) audio.play();
        }

        // 上一首
        function prevTrack() {
            if(audio.currentTime > 3) {
                audio.currentTime = 0;
            } else {
                currentIndex = (currentIndex - 1 + trackList.length) % trackList.length;
                loadTrack(currentIndex);
                if(isPlaying) audio.play();
            }
        }

        // 点击列表切歌
        trackItems.forEach(item => {
            item.addEventListener('click', () => {
                const idx = Number(item.dataset.index);
                loadTrack(idx);
                if(!isPlaying) togglePlay();
                else audio.play();
            })
        })

        // 按钮绑定事件
        mainPlayBtn.addEventListener('click', togglePlay);
        nextBtn.addEventListener('click', nextTrack);
        prevBtn.addEventListener('click', prevTrack);

        loopBtn.addEventListener('click', () => {
            isLoop = !isLoop;
            loopBtn.classList.toggle('opacity-100', isLoop);
            loopBtn.classList.toggle('opacity-70', !isLoop);
        })
        shuffleBtn.addEventListener('click', () => {
            isShuffle = !isShuffle;
            shuffleBtn.classList.toggle('opacity-100', isShuffle);
            shuffleBtn.classList.toggle('opacity-70', !isShuffle);
        })

        // 页面加载完成自动播放兼容处理
        window.addEventListener('load', () => {
            loadTrack(0);
            // 解除静音，尝试正常播放
            audio.muted = false;
            audio.play().catch(() => {
                // 浏览器拦截自动播放时，维持静音自动播放
                audio.muted = true;
                audio.play();
            });
        })
    </script>
</body>
</html>
