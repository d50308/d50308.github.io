<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>chen!</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brandPink: '#ff6b9d',
                        brandCyan: '#4cd0d0',
                        brandOrange: '#ffb86c',
                        darkText: '#1a1a2e'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            /* 背景圖專用樣式 */
            .hero-bg-image {
                background-image: url("./hero-gradient-bg.png");
                background-size: cover;
                background-position: center;
                background-repeat: no-repeat;
            }
            .track-item-hover {
                transition: all 0.2s ease;
            }
            .track-item-hover:hover {
                background: #f8f9ff;
            }
            .progress-slider {
                -webkit-appearance: none;
                width: 100%;
                height: 4px;
                border-radius: 99px;
                background: rgba(255,255,255,0.3);
            }
            .progress-slider::-webkit-slider-thumb {
                -webkit-appearance: none;
                width: 12px;
                height: 12px;
                border-radius: 50%;
                background: #fff;
                cursor: pointer;
            }
            /* 專輯封面區塊 無圓角、正方形基底 */
            .cover-container {
                position: relative;
                border-radius: 0;
                overflow: hidden;
                background: linear-gradient(135deg, #ffb86c, #ff6b9d);
                aspect-ratio: 1 / 1; /* 強制正方形 */
                transform: scale(0.7); /* 整體縮小30% */
                transform-origin: center;
            }
            .cover-overlay {
                position: absolute;
                inset: 0;
                background: rgba(0,0,0,0.2);
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .song-title-badge {
                position: absolute;
                bottom: 8px;
                right: 8px;
                background: rgba(0,0,0,0.5);
                color: #fff;
                padding: 4px 8px;
                border-radius: 0; /* 底塊無圓角 */
                font-size: 18px;
                font-weight: bold; /* 歌名粗體放大150% */
                backdrop-filter: blur(2px);
            }
        }
    </style>
</head>
<body class="bg-white font-sans text-darkText overflow-x-hidden">
    <!-- Hero 主視覺 -->
    <section class="min-h-screen hero-bg-image px-6 md:px-12 lg:px-20 py-8 relative overflow-hidden">
        <div class="absolute inset-0 bg-white/20"></div>
        <div class="relative z-10">
            <!-- Logo 放大20% -->
            <div class="flex justify-center mb-10">
                <img src="https://d50308.github.io/logo.png" alt="chen! logo" class="h-[43px] md:h-[50px]">
            </div>

            <div class="grid lg:grid-cols-2 items-center gap-6 lg:gap-0">
                <!-- 左側文字 -->
                <div class="order-1 lg:order-1 pt-4 lg:pt-0">
                    <!-- VIRTUAL ARTIST：超粗、縮小50%、字距縮減60%、下方行距4倍 -->
                    <p class="text-gray-300 font-black text-[50%] tracking-[10px] mb-[4em]">VIRTUAL ARTIST</p>
                    <h1 class="text-[clamp(1.5rem,3.6vw,2.4rem)] font-bold leading-tight mb-4">
                        這份自在<br>
                        <span class="font-bold not-italic">We Share.</span>
                    </h1>
                    <p class="text-gray-500 max-w-sm">
                        - 《We Share》by chen!
                    </p>
                </div>

                <!-- 人物放大30% -->
                <div class="order-2 lg:order-2 flex justify-end lg:translate-y-6 mt-8 lg:mt-0">
                    <img 
                        src="https://d50308.github.io/concept%20.png" 
                        alt="chen! virtual singer" 
                        class="max-w-[117%] w-[117%] scale-117 origin-right lg:origin-right mx-auto lg:mx-0"
                    >
                </div>
            </div>
        </div>
    </section>

    <!-- 播放器區塊 -->
    <section class="px-6 md:px-12 lg:px-20 -mt-10 lg:-mt-24 relative z-10 pb-16">
        <div class="bg-white rounded-2xl shadow-xl p-6 md:p-8 max-w-5xl mx-auto">
            <div class="mb-6">
                <!-- LISTEN NOW 粗體縮小12% -->
                <p class="text-brandPink font-bold tracking-wide mb-1 text-[88%]">LISTEN NOW</p>
                <h2 class="text-2xl font-bold">Featured Tracks</h2>
            </div>
            <div class="grid lg:grid-cols-2 gap-8 items-center">
                <!-- 歌曲清單 每格高度縮小30% -->
                <div class="space-y-3" id="trackList">
                    <div class="track-item-hover rounded-xl p-2 flex items-center gap-4 bg-gray-50 cursor-pointer h-14" data-index="0">
                        <div class="w-10 h-10 rounded-md bg-gradient-to-r from-brandPink to-brandOrange flex items-center justify-center text-white play-icon">
                            <i class="fa fa-play"></i>
                        </div>
                        <div class="flex-1">
                            <p class="font-medium">We Share</p>
                        </div>
                        <span class="text-gray-400 text-sm track-duration">03:42</span>
                    </div>
                    <div class="track-item-hover rounded-xl p-2 flex items-center gap-4 cursor-pointer h-14" data-index="1">
                        <div class="w-10 h-10 rounded-md bg-[#a0d8f0] flex items-center justify-center text-white play-icon">
                            <i class="fa fa-play-o"></i>
                        </div>
                        <div class="flex-1">
                            <p class="font-medium">雨的節奏</p>
                        </div>
                        <span class="text-gray-400 text-sm track-duration">03:58</span>
                        <i class="fa fa-ellipsis-v text-gray-300"></i>
                    </div>
                    <div class="track-item-hover rounded-xl p-2 flex items-center gap-4 cursor-pointer h-14" data-index="2">
                        <div class="w-10 h-10 rounded-md bg-[#e0d8ff] flex items-center justify-center text-white play-icon">
                            <i class="fa fa-play-o"></i>
                        </div>
                        <div class="flex-1">
                            <p class="font-medium">To the Light</p>
                        </div>
                        <span class="text-gray-400 text-sm track-duration">04:21</span>
                        <i class="fa fa-ellipsis-v text-gray-300"></i>
                    </div>
                    <div class="track-item-hover rounded-xl p-2 flex items-center gap-4 cursor-pointer h-14" data-index="3">
                        <div class="w-10 h-10 rounded-md bg-[#2a1b47] flex items-center justify-center text-white play-icon">
                            <i class="fa fa-play-o"></i>
                        </div>
                        <div class="flex-1">
                            <p class="font-medium">Moonlight on Repeat</p>
                        </div>
                        <span class="text-gray-400 text-sm track-duration">03:33</span>
                        <i class="fa fa-ellipsis-v text-gray-300"></i>
                    </div>
                </div>

                <!-- 正方形縮小30%封面區、無內置圖、JS讀取專輯封面 -->
                <div class="cover-container w-full">
                    <img id="albumCoverImg" src="" alt="album cover" class="w-full h-full object-cover hidden">
                    <div class="cover-overlay" id="coverOverlay">
                        <button class="w-16 h-16 rounded-full bg-white/80 text-brandPink flex items-center justify-center text-2xl" id="coverPlayBtn">
                            <i class="fa fa-pause"></i>
                        </button>
                    </div>
                    <div class="song-title-badge" id="coverSongTitle">We Share</div>
                </div>
            </div>
        </div>
    </section>

    <!-- 訂閱區 隱藏 -->
    <section class="bg-gradient-to-r from-brandPink/15 to-brandCyan/15 px-6 md:px-12 lg:px-20 py-10 hidden">
        <div class="max-w-5xl mx-auto flex flex-col md:flex-row items-center justify-between gap-6">
            <div>
                <h3 class="text-xl font-bold mb-1">Be the first to know.</h3>
                <p class="text-gray-500 text-sm">Get the latest updates from chen!</p>
            </div>
            <div class="flex w-full md:w-auto">
                <input type="email" placeholder="Enter your email" class="px-4 py-3 rounded-l-full border border-gray-200 outline-none w-full md:w-64 focus:border-brandPink transition-all">
                <button class="bg-darkText text-white px-6 py-3 rounded-r-full hover:opacity-90 transition-all">Subscribe</button>
            </div>
        </div>
    </section>

    <audio id="audioPlayer" autoplay muted>
        <source src="https://d50308.github.io/We%20Share.mp3" type="audio/mpeg">
    

    <script>
        // 每首歌新增 albumCover 專輯封面參數
        const trackList = [
            { 
                title: "We Share", 
                src: "https://d50308.github.io/We%20Share.mp3", 
                duration: "03:42",
                albumCover: "https://d50308.github.io/cover-we-share.png"
            },
            { 
                title: "雨的節奏", 
                src: "https://d50308.github.io/rain.mp3", 
                duration: "03:58",
                albumCover: "https://d50308.github.io/cover-rain.png"
            },
            { 
                title: "To the Light", 
                src: "https://d50308.github.io/light.mp3", 
                duration: "04:21",
                albumCover: "https://d50308.github.io/cover-light.png"
            },
            { 
                title: "Moonlight on Repeat", 
                src: "https://d50308.github.io/moon.mp3", 
                duration: "03:33",
                albumCover: "https://d50308.github.io/cover-moon.png"
            }
        ];
        let currentIndex = 0;
        let isPlaying = true;
        let isLoop = false;
        let isShuffle = false;

        const audio = document.getElementById('audioPlayer');
        const coverPlayBtn = document.getElementById('coverPlayBtn');
        const coverSongTitle = document.getElementById('coverSongTitle');
        const albumCoverImg = document.getElementById('albumCoverImg');
        const trackItems = document.querySelectorAll('#trackList > div');

        // 切換歌曲時自動替換專輯封面
        function loadTrack(index) {
            currentIndex = index;
            const track = trackList[currentIndex];
            audio.src = track.src;
            coverSongTitle.innerText = track.title;
            // 載入專輯封面圖片
            albumCoverImg.src = track.albumCover;
            albumCoverImg.classList.remove('hidden');
            
            audio.currentTime = 0;
            trackItems.forEach((item, idx) => {
                const icon = item.querySelector('.play-icon i');
                if(idx === currentIndex) {
                    icon.className = isPlaying ? "fa fa-pause" : "fa fa-play";
                    item.classList.add('bg-gray-50');
                } else {
                    icon.className = "fa fa-play-o";
                    item.classList.remove('bg-gray-50');
                }
            })
            coverPlayBtn.innerHTML = isPlaying ? '<i class="fa fa-pause"></i>' : '<i class="fa fa-play"></i>';
        }

        function formatTime(sec) {
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
        }

        function togglePlay() {
            if(isPlaying) {
                audio.pause();
                coverPlayBtn.innerHTML = '<i class="fa fa-play"></i>';
                trackItems[currentIndex].querySelector('.play-icon i').className = "fa fa-play";
            } else {
                audio.play();
                coverPlayBtn.innerHTML = '<i class="fa fa-pause"></i>';
                trackItems[currentIndex].querySelector('.play-icon i').className = "fa fa-pause";
            }
            isPlaying = !isPlaying;
        }

        audio.addEventListener('ended', () => {
            if(isLoop) {
                audio.currentTime = 0;
                audio.play();
            } else {
                nextTrack();
            }
        })

        function nextTrack() {
            if(isShuffle) {
                let randomIdx = Math.floor(Math.random() * trackList.length);
                while(randomIdx === currentIndex) randomIdx = Math.floor(Math.random() * trackList.length);
                loadTrack(randomIdx);
            } else {
                currentIndex = (currentIndex + 1) % trackList.length;
                loadTrack(currentIndex);
            }
            if(isPlaying) audio.play();
        }

        function prevTrack() {
            if(audio.currentTime > 3) {
                audio.currentTime = 0;
            } else {
                currentIndex = (currentIndex - 1 + trackList.length) % trackList.length;
                loadTrack(currentIndex);
                if(isPlaying) audio.play();
            }
        }

        trackItems.forEach(item => {
            item.addEventListener('click', () => {
                const idx = Number(item.dataset.index);
                loadTrack(idx);
                if(!isPlaying) togglePlay();
                else audio.play();
            })
        })

        coverPlayBtn.addEventListener('click', togglePlay);

        window.addEventListener('load', () => {
            loadTrack(0);
            audio.muted = false;
            audio.play().catch(() => {
                audio.muted = true;
                audio.play();
            });
        })
    </script>
</body>
</html>
