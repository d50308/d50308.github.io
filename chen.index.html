<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>chen! - Virtual Singer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Banner 區塊 -->
  <section class="banner">
    <img src="banner.png" alt="chen banner">
    <div class="hero-text">
      <h1>Hello, I’m chen! Your Story, My Song.</h1>
      <p>A virtual singer here to share moments that move us—together.</p>
      <button class="discover"><span>Discover chen!</span></button>
    </div>
  </section>

  <!-- 音樂播放器 -->
  <section class="music">
    <h2>LISTEN NOW</h2>
    <ul>
      <li>We Share (03:42)</li>
      <li>雨的節奏 (03:58)</li>
      <li>To the Light (04:21)</li>
      <li>Moonlight on Repeat (03:33)</li>
    </ul>
    <div class="player">
      <p>Now Playing: We Share</p>
      <progress value="78" max="222"></progress>
    </div>
  </section>

  <!-- 訂閱區 -->
  <section class="subscribe">
    <h3>Be the first to know</h3>
    <p>Get the latest updates from chen!</p>
    <form>
      <input type="email" placeholder="Enter your email">
      <button type="submit">Subscribe</button>
    </form>
  </section>

  <!-- 點擊波紋效果 JS -->
  <script>
  document.querySelectorAll('.discover').forEach(button => {
    button.addEventListener('click', function(e) {
      const ripple = document.createElement('span');
      ripple.classList.add('ripple');
      const rect = button.getBoundingClientRect();
      const size = Math.max(rect.width, rect.height);
      ripple.style.width = ripple.style.height = size + 'px';
      ripple.style.left = (e.clientX - rect.left - size/2) + 'px';
      ripple.style.top = (e.clientY - rect.top - size/2) + 'px';
      button.appendChild(ripple);
      setTimeout(() => ripple.remove(), 600);
    });
  });
  </script>
</body>
</html>
