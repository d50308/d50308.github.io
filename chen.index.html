<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>chen!</title>
    <!-- 網頁標籤Icon使用Logo -->
    <link rel="icon" href="https://d50308.github.io/logo.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brandPink: '#ff6b9d',
                        brandCyan: '#4cd0d0',
                        brandOrange: '#ffb86c',
                        darkText: '#1a1a2e',
                        grayMid: '#666666',
                        grayLight: '#aaaaaa',
                        pageBg: '#f7f7f9',
                        goldPale: '#d6b56a'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            /* 背景图 bg3 */
            .hero-bg-image {
                background-image: url("./bg3.png");
                background-size: cover;
                background-position: center;
                background-repeat: no-repeat;
            }
            .track-item-hover {
                transition: all 0.2s ease;
            }
            .track-item-hover:hover {
                background: #f8f9ff;
            }
            /* 专辑封面 圆角正方形缩小30% */
            .cover-container {
                position: relative;
                border-radius: 24px;
                overflow: hidden;
                background: linear-gradient(135deg, #ffb86c, #ff6b9d);
                aspect-ratio: 1 / 1;
                transform: scale(0.7);
                transform-origin: center;
            }
            /* 右下角歌名放大40% */
            .song-title-badge {
                position: absolute;
                bottom: 12px;
                right: 12px;
                background: rgba(0, 0, 0, 0.5);
                color: #fff;
                padding: 6px 10px;
                border-radius: 0;
                font-size: 25px;
                font-weight: bold;
                backdrop-filter: blur(2px);
            }
            /* VIRTUAL ARTIST 浅金、字距收窄、透明度65%、扁字 */
            .virtual-artist-text {
                color: #d6b56a;
                letter-spacing: 4px;
                opacity: 0.65;
                font-stretch: condensed;
            }
            /* 悬浮垂直音量控件 缩小20%、宽度减20% */
            .global-volume-wrap {
                position: fixed;
                bottom: 24px;
                right: 24px;
                z-index: 9999;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 12px;
                background: rgba(240,240,240,0.8);
                width: 58px;
                height: 180px;
                padding: 16px 10px;
                border-radius: 999px;
                box-shadow: 0 4px 16px rgba(0,0,0,0.12);
                transform: scale(0.8);
            }
            .volume-slider {
                -webkit-appearance: none;
                width: 6px;
                height: 110px;
                border-radius: 999px;
                background: #aaaaaa;
                outline: none;
                writing-mode: vertical-lr;
                direction: rtl;
            }
            .volume-slider::-webkit-slider-thumb {
                -webkit-appearance: none;
                width: 18px;
                height: 18px;
                border-radius: 50%;
                background: #666666;
                cursor: pointer;
            }
            .volume-icon-style {
                font-size: 24px;
                color: #666666;
                cursor: pointer;
            }
            /* 歌曲进度条 */
            .track-progress {
                -webkit-appearance: none;
                width: 70px;
                height: 4px;
                border-radius: 999px;
                background: #e5e7eb;
            }
            .track-progress::-webkit-slider-thumb {
                -webkit-appearance: none;
                width: 12px;
                height: 12px;
                border-radius: 50%;
                background: #ff6b9d;
                cursor: pointer;
            }
        }
    </style>
</head>
<body class="bg-pageBg font-sans text-darkText overflow-x-hidden">
    <!-- 右下角悬浮音量 -->
    <div class="global-volume-wrap">
        <i class="fa fa-volume-up volume-icon-style" id="volumeIcon"></i>
        <input type="range" min="0" max="100" value="70" class="volume-slider" id="volumeSlider">
    </div>

    <!-- 主视觉区块 -->
    <section class="min-h-screen hero-bg-image px-6 md:px-12 lg:px-20 py-0 relative overflow-hidden">
        <div class="absolute inset-0 bg-white/20"></div>
        <div class="relative z-10">
            <!-- 顶部Logo 移动端加大下方间距 -->
            <div class="flex justify-center mb-10 md:mb-8">
                <img src="https://d50308.github.io/logo.png" alt="chen! " class="h-[74px] md:h-[86px]">
            </div>

            <div class="grid lg:grid-cols-2 items-center gap-6 lg:gap-0">
                <!-- 左侧文字：移动端底部margin缩小，拉近人物 -->
                <div class="order-1 lg:order-1 pt-2 lg:pt-0 pl-6 md:pl-12 lg:pl-20 scale-[1.12] origin-left mb-2 lg:mb-0">
                    <p class="virtual-artist-text font-black text-[50%] mb-[2em] lg:mb-[4em]">VIRTUAL ARTIST</p>
                    <!-- 這份自在 + We Share 同行、同粗、统一缩小20%、透明度88% -->
                    <h1 class="text-[clamp(0.96rem,2.304vw,1.536rem)] font-bold leading-tight mb-4 flex items-baseline gap-3 opacity-[0.88]">
                        這份自在
                        <span>We Share.</span>
                    </h1>
                    <!-- 底部小字缩小15%，logo尺寸贴合文字，不再超大挤字 -->
                    <p class="text-gray-500 max-w-sm flex items-center gap-1" style="font-size: 85%;">
                        - 《We Share》by
                        <img src="https://d50308.github.io/logo.png" alt="chen!" class="h-[3.6em] w-auto inline-block align-baseline">
                    </p>
                </div>

                <!-- 右侧人物：移动端无scale放大，桌面端scale-117 -->
                <div class="order-2 lg:order-2 flex justify-end lg:translate-y-6 mt-0 lg:mt-0">
                    <img
                        src="https://d50308.github.io/concept%20.png"
                        alt="chen! virtual singer"
                        class="max-w-full w-full lg:max-w-[117%] lg:w-[117%] lg:scale-117 origin-right lg:origin-right mx-auto lg:mx-0"
                    >
                </div>
            </div>
        </div>
    </section>

    <!-- 播放器卡片区域 -->
    <section class="px-6 md:px-12 lg:px-20 -mt-10 lg:-mt-24 relative z-10 pb-16">
        <div class="bg-white rounded-2xl shadow-xl p-6 md:p-8 max-w-5xl mx-auto">
            <div class="mb-6 text-left">
                <p class="text-brandPink font-bold tracking-wide mb-1 text-[88%]">LISTEN NOW</p>
                <h2 class="text-2xl font-bold">Featured Tracks</h2>
            </div>
            <div class="grid lg:grid-cols-2 gap-8 items-center">
                <!-- 歌曲列表：播放/暂停均显示进度+时间，仅切歌隐藏重置 -->
                <div class="space-y-3" id="trackList">
                    <div class="track-item-hover rounded-xl p-2 flex items-center gap-3 bg-gray-50 cursor-pointer h-14" data-index="0">
                        <div class="w-10 h-10 rounded-md bg-gradient-to-r from-brandPink to-brandOrange flex items-center justify-center text-white play-icon">
                            <i class="fa fa-play"></i>
                        </div>
                        <div class="flex-1">
                            <p class="font-medium">We Share</p>
                        </div>
                        <span class="text-gray-400 text-sm current-time hidden" id="curr0">00:00</span>
                        <input type="range" min="0" max="100" value="0" class="track-progress hidden" id="progress0">
                        <span class="text-gray-400 text-sm track-duration">03:24</span>
                    </div>
                    <div class="track-item-hover rounded-xl p-2 flex items-center gap-3 cursor-pointer h-14" data-index="1">
                        <div class="w-10 h-10 rounded-md bg-[#a0d8f0] flex items-center justify-center text-white play-icon">
                            <i class="fa fa-play-o"></i>
                        </div>
                        <div class="flex-1">
                            <p class="font-medium">雨的節奏</p>
                        </div>
                        <span class="text-gray-400 text-sm current-time hidden" id="curr1">00:00</span>
                        <input type="range" min="0" max="100" value="0" class="track-progress hidden" id="progress1">
                        <span class="text-gray-400 text-sm track-duration">03:09</span>
                        <i class="fa fa-ellipsis-v text-gray-300"></i>
                    </div>
                    <div class="track-item-hover rounded-xl p-2 flex items-center gap-3 cursor-pointer h-14" data-index="2">
                        <div class="w-10 h-10 rounded-md bg-[#e0d8ff] flex items-center justify-center text-white play-icon">
                            <i class="fa fa-play-o"></i>
                        </div>
                        <div class="flex-1">
                            <p class="font-medium">To the Light</p>
                        </div>
                        <span class="text-gray-400 text-sm current-time hidden" id="curr2">00:00</span>
                        <input type="range" min="0" max="100" value="0" class="track-progress hidden" id="progress2">
                        <span class="text-gray-400 text-sm track-duration">02:57</span>
                        <i class="fa fa-ellipsis-v text-gray-300"></i>
                    </div>
                    <div class="track-item-hover rounded-xl p-2 flex items-center gap-3 cursor-pointer h-14" data-index="3">
                        <div class="w-10 h-10 rounded-md bg-[#2a1b47] flex items-center justify-center text-white play-icon">
                            <i class="fa fa-play-o"></i>
                        </div>
                        <div class="flex-1">
                            <p class="font-medium">Moonlight on Repeat</p>
                        </div>
                        <span class="text-gray-400 text-sm current-time hidden" id="curr3">00:00</span>
                        <input type="range" min="0" max="100" value="0" class="track-progress hidden" id="progress3">
                        <span class="text-gray-400 text-sm track-duration">03:16</span>
                        <i class="fa fa-ellipsis-v text-gray-300"></i>
                    </div>
                </div>
                <!-- 专辑封面区域 -->
                <div class="cover-container w-full">
                    <img id="albumCoverImg" src="" alt="album cover" class="w-full h-full object-cover hidden">
                    <div class="song-title-badge" id="coverSongTitle">We Share</div>
                </div>
            </div>
        </div>
    </section>

    <!-- 订阅栏 -->
    <section class="bg-gradient-to-r from-brandPink/15 to-brandCyan/15 px-6 md:px-12 lg:px-20 py-10">
        <div class="max-w-5xl mx-auto flex flex-col md:flex-row items-center justify-between gap-6">
            <div>
                <h3 class="text-xl font-bold mb-1">Be the first to know.</h3>
                <p class="text-gray-500 text-sm">Get the latest updates from chen!</p>
            </div>
            <div class="flex w-full md:w-auto">
                <input type="email" placeholder="Enter your email" class="px-4 py-3 rounded-l-full border border-gray-200 outline-none w-full md:w-64 focus:border-brandPink transition-all">
                <button class="bg-darkText text-white px-6 py-3 rounded-r-full hover:opacity-90 transition-all">X</button>
            </div>
        </div>
    </section>

    <!-- 音频播放器 -->
    <audio id="audioPlayer" muted>
        <source src="https://d50308.github.io/We%20Share.mp3" type="audio/mpeg">
    

    <script>
        const trackList = [
            {
                title: "We Share",
                src: "https://d50308.github.io/We%20Share.mp3",
                duration: "03:24",
                totalSec: 222,
                albumCover: "https://d50308.github.io/cover-we-share.png"
            },
            {
                title: "雨的節奏",
                src: "%E9%9B%A8%E7%9A%84%E7%AF%80%E5%A5%8F.mp3",
                duration: "03:09",
                totalSec: 238,
                albumCover: "https://d50308.github.io/cover-rain.png"
            },
            {
                title: "To the Light",
                src: "To%20the%20Light.mp3",
                duration: "02:57",
                totalSec: 261,
                albumCover: "https://d50308.github.io/cover-light.png"
            },
            {
                title: "Moonlight on Repeat",
                src: "Moonlight%20on%20Repeat.mp3",
                duration: "03:16",
                totalSec: 213,
                albumCover: "https://d50308.github.io/cover-moon.png"
            }
        ];
        let currentIndex = 0;
        let isPlaying = false;
        let isLoop = false;
        let isShuffle = false;
        let progressTimer = null;
        let lastVolumeBeforeMute = 0.7;

        const audio = document.getElementById('audioPlayer');
        const coverSongTitle = document.getElementById('coverSongTitle');
        const albumCoverImg = document.getElementById('albumCoverImg');
        const trackItems = document.querySelectorAll('#trackList > div');
        const volumeSlider = document.getElementById('volumeSlider');
        const volumeIcon = document.getElementById('volumeIcon');
        const progressEls = [
            document.getElementById('progress0'),
            document.getElementById('progress1'),
            document.getElementById('progress2'),
            document.getElementById('progress3')
        ];
        const currTimeEls = [
            document.getElementById('curr0'),
            document.getElementById('curr1'),
            document.getElementById('curr2'),
            document.getElementById('curr3')
        ];

        // 秒转 00:00
        function secToMMSS(sec) {
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
        }

        // 切歌加载曲目
        function loadTrack(index) {
            clearInterval(progressTimer);
            // 切歌才隐藏进度时间，暂停不隐藏
            progressEls.forEach(el => el.classList.add('hidden'));
            currTimeEls.forEach(el => {
                el.classList.add('hidden');
                el.textContent = '00:00';
            });
            currentIndex = index;
            const track = trackList[currentIndex];
            audio.src = track.src;
            coverSongTitle.innerText = track.title;
            albumCoverImg.src = track.albumCover;
            albumCoverImg.classList.remove('hidden');
            audio.currentTime = 0;
            // 修复1：进度条max绑定当前歌曲总秒数，不会拖出时长
            progressEls[currentIndex].max = track.totalSec;
            progressEls[currentIndex].value = 0;
            currTimeEls[currentIndex].textContent = '00:00';
            // 更新播放图标
            trackItems.forEach((item, idx) => {
                const icon = item.querySelector('.play-icon i');
                if (idx === currentIndex) {
                    icon.className = isPlaying ? "fa fa-pause" : "fa fa-play";
                    item.classList.add('bg-gray-50');
                } else {
                    icon.className = "fa fa-play-o";
                    item.classList.remove('bg-gray-50');
                }
            })
            // 切完立刻显示进度时间
            progressEls[currentIndex].classList.remove('hidden');
            currTimeEls[currentIndex].classList.remove('hidden');
            if (isPlaying) {
                const total = trackList[currentIndex].totalSec;
                progressTimer = setInterval(() => {
                    const sec = audio.currentTime;
                    progressEls[currentIndex].value = sec;
                    currTimeEls[currentIndex].textContent = secToMMSS(sec);
                }, 1000);
            }
        }

        // 播放暂停切换（暂停不隐藏进度时间）
        function togglePlay() {
            if (isPlaying) {
                audio.pause();
                clearInterval(progressTimer);
            } else {
                audio.muted = false;
                audio.play();
                const total = trackList[currentIndex].totalSec;
                progressTimer = setInterval(() => {
                    const sec = audio.currentTime;
                    progressEls[currentIndex].value = sec;
                    currTimeEls[currentIndex].textContent = secToMMSS(sec);
                }, 1000);
            }
            isPlaying = !isPlaying;
            const currentIcon = trackItems[currentIndex].querySelector('.play-icon i');
            currentIcon.className = isPlaying ? "fa fa-pause" : "fa fa-play";
        }

        // 拖动进度条跳转（修复1：按真实秒数计算）
        progressEls.forEach((el, idx) => {
            el.addEventListener('input', () => {
                if (idx === currentIndex) {
                    const sec = Number(el.value);
                    audio.currentTime = sec;
                    currTimeEls[currentIndex].textContent = secToMMSS(sec);
                }
            })
        })

        // 歌曲播放完毕自动下一首
        audio.addEventListener('ended', () => {
            clearInterval(progressTimer);
            if (isLoop) {
                audio.currentTime = 0;
                audio.play();
            } else {
                nextTrack();
            }
        })

        // 下一曲（修复2：切歌后自动播放）
        function nextTrack() {
            if (isShuffle) {
                let randomIdx = Math.floor(Math.random() * trackList.length);
                while (randomIdx === currentIndex) randomIdx = Math.floor(Math.random() * trackList.length);
                loadTrack(randomIdx);
            } else {
                currentIndex = (currentIndex + 1) % trackList.length;
                loadTrack(currentIndex);
            }
            // 原本播放状态，切完直接播放
            if (isPlaying) {
                audio.muted = false;
                audio.play();
            }
        }

        // 上一曲
        function prevTrack() {
            if (audio.currentTime > 3) {
                audio.currentTime = 0;
            } else {
                currentIndex = (currentIndex - 1 + trackList.length) % trackList.length;
                loadTrack(currentIndex);
                if (isPlaying) {
                    audio.muted = false;
                    audio.play();
                }
            }
        }

        // 点击歌曲切换播放
        trackItems.forEach(item => {
            item.addEventListener('click', () => {
                const idx = Number(item.dataset.index);
                if (idx !== currentIndex) {
                    loadTrack(idx);
                    if (!isPlaying) {
                        togglePlay();
                    } else {
                        audio.play();
                    }
                } else {
                    togglePlay();
                }
            })
        })

        // 音量滑块
        volumeSlider.addEventListener('input', () => {
            const volume = volumeSlider.value / 100;
            audio.volume = volume;
            if (volume > 0) lastVolumeBeforeMute = volume;
            if (volume === 0) {
                volumeIcon.className = 'fa fa-volume-off volume-icon-style';
            } else if (volume < 0.5) {
                volumeIcon.className = 'fa fa-volume-down volume-icon-style';
            } else {
                volumeIcon.className = 'fa fa-volume-up volume-icon-style';
            }
        });

        // 点击音量图标静音/恢复
        volumeIcon.addEventListener('click', () => {
            if (audio.muted || audio.volume === 0) {
                audio.muted = false;
                audio.volume = lastVolumeBeforeMute;
                volumeSlider.value = lastVolumeBeforeMute * 100;
                volumeIcon.className = lastVolumeBeforeMute < 0.5 ? 'fa fa-volume-down volume-icon-style' : 'fa fa-volume-up volume-icon-style';
            } else {
                lastVolumeBeforeMute = audio.volume;
                audio.muted = true;
                volumeSlider.value = 0;
                volumeIcon.className = 'fa fa-volume-off volume-icon-style';
            }
        });

        window.addEventListener('load', () => {
            loadTrack(0);
            audio.volume = 0.7;
            lastVolumeBeforeMute = 0.7;
            volumeSlider.value = 70;
            volumeIcon.className = 'fa fa-volume-up volume-icon-style';
            audio.muted = true;
            // 彻底删除页面点击自动播放监听，打开浏览器不会自动播放
        })
    </script>
</body>
</html>
